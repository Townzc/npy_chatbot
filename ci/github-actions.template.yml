name: synthetic-core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked --group dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src/chattwin
      - run: uv run pytest -q
      - run: uv run chattwin demo
      - run: uv run python scripts/privacy_check.py
      - run: uv run python scripts/export_schema.py
      - run: git diff --exit-code schemas
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm generate:api && pnpm build
        working-directory: apps/web
      - run: git diff --exit-code apps/web/src/generated-api.ts
